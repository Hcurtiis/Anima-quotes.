name: Validate quotes
on:
  push:
    paths: ['quotes.json', 'scripts/validate-quotes.js', '.github/workflows/validate-quotes.yml']
  pull_request:
    paths: ['quotes.json', 'scripts/validate-quotes.js', '.github/workflows/validate-quotes.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: node scripts/validate-quotes.js
